name: Validate Ayu Wallet

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: validate-${{ github.ref }}
  cancel-in-progress: true

jobs:
  validate:
    name: Validate frontend and wallet logic
    runs-on: ubuntu-latest

    steps:
      - name: Checkout
        uses: actions/checkout@v5

      - name: Validate JavaScript syntax
        run: node --check index.js

      - name: Validate ABI JSON
        run: node -e "const fs=require('fs'); const abi=JSON.parse(fs.readFileSync('abi.json','utf8')); if(!Array.isArray(abi)||!abi.length) process.exit(1); console.log('ABI entries:',abi.length)"

      - name: Run UI separation and security checks
        run: node scripts/validate-ui.mjs

      - name: Validate required files
        run: test -f index.html && test -f styles.css && test -f config.js && test -f abi.json && test -f scripts/validate-ui.mjs

      - name: Check HTML references
        run: |
          grep -q 'styles.css' index.html
          grep -q 'config.js' index.html
          grep -q 'index.js' index.html
          echo "HTML asset references passed."

      - name: Summary
        run: echo "Ayu Wallet validation passed."
