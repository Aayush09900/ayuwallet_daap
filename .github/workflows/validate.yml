name: Validate Ayu Wallet

on:
  push:
    branches: [main]
  pull_request:

permissions:
  contents: read

jobs:
  validate:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v5
      - name: Validate JavaScript syntax
        run: node --check index.js
      - name: Validate ABI JSON
        run: node -e "const fs=require('fs'); const abi=JSON.parse(fs.readFileSync('abi.json','utf8')); if(!Array.isArray(abi)||!abi.length) process.exit(1); console.log('ABI entries:',abi.length)"
      - name: Validate required files
        run: test -f index.html && test -f styles.css && test -f config.js && test -f abi.json
